# Environment used to build the paper's figures and tables (the same
# environment FastSpecFit itself is developed in). Versions are not yet
# pinned; an exact lockfile will be archived with the Zenodo release.
name: fastspec
channels:
  - conda-forge
dependencies:
  - python
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - astropy
  - fitsio
  - pyyaml
  - speclite
  - pip
  - pip:
    # DESI software stack
    - git+https://github.com/desihub/fastspecfit.git
    - git+https://github.com/desihub/desitarget.git
    - git+https://github.com/desihub/desispec.git
    - git+https://github.com/desihub/desiutil.git
